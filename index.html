<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cheshire</title>
  <meta name="description" content="柴郡的个人主页">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 背景图片轮播层与柔和遮罩 -->
  <div class="bg-slider" id="bgSlider"></div>
  <div class="bg-overlay"></div>
  <div class="noise"></div>
  <div class="glow"></div>

  <div class="dashboard">

    <header>
      <div class="mark"><span class="dot"></span>Cheshire</div>
      <nav class="links" id="linkRow"></nav>
    </header>

    <main>
      <div class="time-wrap">
        <div class="clock" id="clock">
          <span id="h">00</span><span class="colon" id="c1">:</span><span id="m">00</span><span class="colon"
            id="c2">:</span><span id="s">00</span>
        </div>
        <div class="date" id="dateLine">—</div>
      </div>

      <div class="weather" id="weatherCard">
        <div class="icon" id="wIcon">⛅</div>
        <div class="info">
          <div class="temp" id="wTemp">--°</div>
          <div class="place" id="wPlace">定位中…</div>
          <div class="desc" id="wDesc">&nbsp;</div>
        </div>
        <button id="weatherEditBtn" title="切换城市">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </button>

        <div class="city-pop" id="cityPop">
          <button class="geo-btn" id="geoBtn">📍 使用当前定位</button>
          <input type="text" id="cityInput" placeholder="输入城市名，回车搜索">
          <div class="chips">
            <button class="chip" data-city="东京">东京</button>
            <button class="chip" data-city="北京">北京</button>
            <button class="chip" data-city="上海">上海</button>
            <button class="chip" data-city="纽约">纽约</button>
            <button class="chip" data-city="伦敦">伦敦</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="player" id="playerBar">
      <div class="track-art" id="trackArt" title="点击展开全屏滚动歌词">
        <div id="trackArtContent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </div>
        <div class="art-overlay" title="展开歌词">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m5 15 7-7 7 7" />
          </svg>
        </div>
      </div>

      <div id="playerEmpty" class="player-empty">
        还没有配置歌单 —— 把 mp3 放进 <b>/music</b> 文件夹并用「生成歌单.html」生成歌单
      </div>

      <div class="track-info" id="trackInfo" title="点击展开全屏滚动歌词">
        <div class="track-title" id="trackTitle">未选择音乐</div>
        <div class="track-sub" id="trackSub">0 首曲目</div>
      </div>

      <div class="controls" id="controlsWrap">
        <button class="ctrl-btn" id="prevBtn" title="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>
        <button class="ctrl-btn" id="playBtn" title="播放/暂停">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z" />
          </svg>
        </button>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <span class="time" id="curTime">0:00</span>
        <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
        <span class="time" id="durTime">0:00</span>
      </div>

      <button class="ctrl-btn" id="listBtn" title="歌单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
      </button>

      <div class="vol-wrap" id="volWrap">
        <button id="volBtn" title="静音 / 取消静音">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
          </svg>
        </button>
        <input type="range" id="volume" value="70" min="0" max="100" step="1">
      </div>

      <div class="playlist-pop" id="playlistPop"></div>

      <audio id="audio"></audio>
    </footer>

  </div>

  <!-- 全屏沉浸式歌词页面（网易云音乐滚动风格） -->
  <div class="lyric-modal" id="lyricModal">
    <div class="lm-bg-glow"></div>

    <div class="lm-header">
      <button class="lm-close-btn" id="lmCloseBtn" title="收起歌词 (ESC)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <div class="lm-song-meta">
        <div class="lm-meta-title" id="lmMetaTitle">未选择音乐</div>
        <div class="lm-meta-artist" id="lmMetaArtist">无歌手信息</div>
      </div>
      <div class="lm-header-right"></div>
    </div>

    <div class="lm-body">
      <!-- 左侧：黑胶唱片 / 专辑大图 -->
      <div class="lm-cover-wrap">
        <div class="lm-disc-box" id="lmDiscBox">
          <div class="lm-disc-grooves"></div>
          <div class="lm-disc-center" id="lmDiscCover">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
        </div>
        <div class="lm-cover-info">
          <div class="lm-cover-title" id="lmCoverTitle">未选择音乐</div>
          <div class="lm-cover-artist" id="lmCoverArtist">未知歌手</div>
        </div>
      </div>

      <!-- 右侧：网易云多行歌词滚动 -->
      <div class="lm-lyrics-box" id="lmLyricsBox">
        <div class="lm-no-lrc">纯音乐 / 暂无歌词</div>
      </div>
    </div>

    <!-- 底部控制栏 -->
    <div class="lm-footer">
      <div class="lm-progress-row">
        <span class="time" id="lmCurTime">0:00</span>
        <input type="range" id="lmSeek" value="0" min="0" max="100" step="0.1">
        <span class="time" id="lmDurTime">0:00</span>
      </div>
      <div class="lm-controls-row">
        <button class="ctrl-btn" id="lmPrevBtn" title="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>
        <button class="ctrl-btn" id="lmPlayBtn" title="播放/暂停">
          <svg id="lmPlayIcon" viewBox="0 0 24 24" fill="currentColor" style="width:18px; height:18px;">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button class="ctrl-btn" id="lmNextBtn" title="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z" />
          </svg>
        </button>

        <div class="lm-side-ctrls">
          <div class="vol-wrap">
            <button id="lmVolBtn" title="静音 / 取消静音">
              <svg id="lmVolIcon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
              </svg>
            </button>
            <input type="range" id="lmVolume" value="70" min="0" max="100" step="1">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="music/playlist.js" onerror="window.PLAYLIST_DATA=null"></script>
  <script src="js/main.js"></script>
<!-- ==================== AI 聊天扩展组件 开始 ==================== -->
<style>
  /* 悬浮图标与弹窗样式 */
  #ai-chat-launcher {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 50px;
    height: 50px;
    background: #2563eb;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    z-index: 99999;
    transition: transform 0.2s ease;
  }
  #ai-chat-launcher:hover {
    transform: scale(1.08);
  }
  #ai-chat-modal {
    display: none;
    position: fixed;
    bottom: 84px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 540px;
    max-height: calc(100vh - 120px);
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    flex-direction: column;
    z-index: 99999;
    color: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .ai-top-bar {
    padding: 10px 12px;
    border-bottom: 1px solid #27272a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #09090b;
    gap: 8px;
  }
  .ai-select {
    background: #27272a;
    color: #fff;
    border: 1px solid #3f3f46;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    max-width: 150px;
    outline: none;
    cursor: pointer;
  }
  .ai-btn-sm {
    background: #27272a;
    color: #d4d4d8;
    border: 1px solid #3f3f46;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .ai-btn-sm:hover {
    background: #3f3f46;
  }
  .ai-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #71717a;
    display: inline-block;
  }
  #ai-chat-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .ai-input-box {
    padding: 10px;
    border-top: 1px solid #27272a;
    background: #09090b;
    display: flex;
    gap: 6px;
  }
  .ai-textarea {
    flex: 1;
    height: 38px;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 6px;
    color: #fff;
    padding: 8px;
    resize: none;
    outline: none;
    font-size: 13px;
  }
  .ai-send-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 0 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
</style>

<!-- 悬浮图标 -->
<div id="ai-chat-launcher" onclick="toggleAIChat()" title="AI 助手">
  <svg width="24" height="24" fill="#ffffff" viewBox="0 0 24 24">
    <path d="M12 2C6.477 2 2 6.477 2 12c0 1.821.487 3.53 1.338 5L2.5 21.5l4.636-.827C8.583 21.433 10.237 22 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
  </svg>
</div>

<!-- 弹出的聊天抽屉 -->
<div id="ai-chat-modal">
  <div class="ai-top-bar">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="ai-conn-status" class="ai-status-dot" title="连通状态"></span>
      <select id="ai-model-select" class="ai-select">
        <option value="">点击测试获取模型</option>
      </select>
      <button class="ai-btn-sm" onclick="checkConnectionAndLoad()">测试</button>
      <button class="ai-btn-sm" onclick="promptKeyConfig()" title="设置Key">🔑</button>
    </div>
    <span onclick="toggleAIChat()" style="cursor: pointer; font-size: 18px; color: #a1a1aa; padding: 0 4px;">&times;</span>
  </div>

  <div id="ai-chat-messages"></div>

  <div class="ai-input-box">
    <textarea id="ai-chat-input" class="ai-textarea" placeholder="发送消息 (Enter 发送)..."></textarea>
    <button class="ai-send-btn" onclick="sendAIMessage()">发送</button>
  </div>
</div>

<script>
  // ==================== 1. 基础服务与人格预设配置 ====================
  const AI_SETTINGS = {
    // 填入你的反代地址（注意结尾不要带斜杠，如：https://api.yourproxy.com/v1）
    baseUrl: "https://你的反代域名/v1",
    
    // 如果是只给你自己用，且不想每次都输入，可填在这里；
    // 但推荐留空，通过面板上的 🔑 图标在浏览器本地保存，防止公开仓库泄露！
    defaultKey: "", 
    
    // AI 内置人格预设
    systemPrompt: `你是一个搭载在站长个人主页上的智能助理与向导。
你的性格特点：亲切友好、幽默风趣且严谨专业。
任务说明：
1. 热情欢迎来到站长主页的访客，解答访客对站长背景、项目与技术的问题；
2. 保持回答精炼生动，条理清晰，乐于提供技术探讨和友好的日常交流。`
  };

  // 读取本地存储的 Key 或默认配置
  function getActiveApiKey() {
    return localStorage.getItem("homepage_ai_key") || AI_SETTINGS.defaultKey;
  }

  // 允许在前端快捷修改与保存 Key 到浏览器本地
  function promptKeyConfig() {
    const currentKey = getActiveApiKey();
    const newKey = prompt("请输入你的 API Key (将仅保存在当前浏览器的 LocalStorage 中，不会上传到 GitHub):", currentKey);
    if (newKey !== null) {
      localStorage.setItem("homepage_ai_key", newKey.trim());
      alert("Key 已更新！正在尝试拉取模型...");
      checkConnectionAndLoad();
    }
  }

  // 消息历史列表（内置人格注入）
  let conversationHistory = [
    { role: "system", content: AI_SETTINGS.systemPrompt }
  ];

  // 弹窗显隐控制
  function toggleAIChat() {
    const modal = document.getElementById("ai-chat-modal");
    const isHidden = modal.style.display === "none" || modal.style.display === "";
    modal.style.display = isHidden ? "flex" : "none";

    // 首次打开自动测试连通性并拉取模型
    if (isHidden && document.getElementById("ai-model-select").options.length <= 1) {
      checkConnectionAndLoad();
      // 输出打招呼
      if (document.getElementById("ai-chat-messages").children.length === 0) {
        renderBubble("assistant", "你好！我是本站的 AI 向导，很高兴见到你！有什么我可以帮你的吗？");
      }
    }
  }

  // 状态指示灯变色 (黄: 测试中, 绿: 正常, 红: 异常)
  function setStatus(state) {
    const dot = document.getElementById("ai-conn-status");
    if (state === "loading") dot.style.background = "#eab308";
    else if (state === "ok") dot.style.background = "#22c55e";
    else dot.style.background = "#ef4444";
  }

  // ==================== 2. 连通性测试与模型动态加载 ====================
  async function checkConnectionAndLoad() {
    const select = document.getElementById("ai-model-select");
    const key = getActiveApiKey();
    setStatus("loading");

    try {
      const headers = {};
      if (key) headers["Authorization"] = `Bearer ${key}`;

      const res = await fetch(`${AI_SETTINGS.baseUrl}/models`, {
        method: "GET",
        headers: headers
      });

      if (!res.ok) throw new Error("Status: " + res.status);

      const json = await res.json();
      const models = json.data || [];

      select.innerHTML = "";
      if (models.length === 0) {
        select.innerHTML = `<option value="">未找到可用模型</option>`;
      } else {
        models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.id;
          select.appendChild(opt);
        });
      }
      setStatus("ok");
    } catch (err) {
      console.error("连通测试失败:", err);
      select.innerHTML = `<option value="">连接异常</option>`;
      setStatus("fail");
    }
  }

  // ==================== 3. 消息交互与聊天发送 ====================
  async function sendAIMessage() {
    const input = document.getElementById("ai-chat-input");
    const select = document.getElementById("ai-model-select");
    const model = select.value;
    const text = input.value.trim();
    const key = getActiveApiKey();

    if (!text) return;
    if (!model) {
      alert("请先选择模型或点击【测试】拉取模型！");
      return;
    }

    // 渲染用户输入
    renderBubble("user", text);
    input.value = "";
    conversationHistory.push({ role: "user", content: text });

    // 占位气泡
    const botBubble = renderBubble("assistant", "思考中...");

    try {
      const headers = { "Content-Type": "application/json" };
      if (key) headers["Authorization"] = `Bearer ${key}`;

      const res = await fetch(`${AI_SETTINGS.baseUrl}/chat/completions`, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          model: model,
          messages: conversationHistory,
          temperature: 0.7
        })
      });

      if (!res.ok) throw new Error("API 响应失败: " + res.status);

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "收到空回复";

      botBubble.innerText = reply;
      conversationHistory.push({ role: "assistant", content: reply });
      setStatus("ok");
    } catch (err) {
      botBubble.innerText = "请求发生错误，请检查网络、跨域设置或 API Key。";
      setStatus("fail");
    }
  }

  function renderBubble(role, text) {
    const container = document.getElementById("ai-chat-messages");
    const bubble = document.createElement("div");
    bubble.style.padding = "8px 12px";
    bubble.style.borderRadius = "8px";
    bubble.style.maxWidth = "82%";
    bubble.style.wordBreak = "break-word";
    bubble.style.whiteSpace = "pre-wrap";

    if (role === "user") {
      bubble.style.alignSelf = "flex-end";
      bubble.style.background = "#2563eb";
      bubble.style.color = "#ffffff";
    } else {
      bubble.style.alignSelf = "flex-start";
      bubble.style.background = "#27272a";
      bubble.style.color = "#f4f4f5";
    }

    bubble.innerText = text;
    container.appendChild(bubble);
    container.scrollTop = container.scrollHeight;
    return bubble;
  }

  // 监听 Enter 快捷键发送
  document.getElementById("ai-chat-input")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendAIMessage();
    }
  });
</script>
<!-- ==================== AI 聊天扩展组件 结束 ==================== -->

</body>

</html>
